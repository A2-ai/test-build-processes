name: Release with Deb Packages

on:
  push:
    tags: ["deb-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Stage 1: Build binaries on AlmaLinux for both architectures
  Build-Binaries:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # x86_64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: almalinux:8
            arch: x86_64

          # aarch64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: almalinux:8
            arch: aarch64

    steps:
      - name: Install dependencies (AlmaLinux)
        if: ${{ contains(matrix.container, 'almalinux') }}
        run: |
          dnf install -y gcc gcc-c++ make git curl tar gzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add Rust target
        run: |
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python (for version check)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          dnf install -y python3

      - name: Check version matches tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          # Strip 'deb-' prefix for version comparison
          TAG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^deb-//')
          python3 .github/scripts/tag_check.py "$TAG_VERSION"

      - name: Cargo build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary for upload
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/test-build-processes artifacts/test-build-processes-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/test-build-processes-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # Stage 2: Use GoReleaser Pro to create .deb packages from pre-built binaries
  Package-Deb:
    needs: [Build-Binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip deb- prefix and create clean tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^deb-//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            # Create a temporary clean tag for GoReleaser
            git tag -f "$VERSION" || true
          else
            echo "version=0.0.0-snapshot" >> $GITHUB_OUTPUT
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          fi

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: ./artifacts
          merge-multiple: false

      - name: Prepare prebuilt binaries for GoReleaser
        run: |
          mkdir -p dist
          # Copy x86_64 binary
          cp artifacts/binary-x86_64-unknown-linux-gnu/test-build-processes-x86_64-unknown-linux-gnu dist/test-build-processes_linux_amd64
          chmod +x dist/test-build-processes_linux_amd64
          # Copy aarch64 binary
          cp artifacts/binary-aarch64-unknown-linux-gnu/test-build-processes-aarch64-unknown-linux-gnu dist/test-build-processes_linux_arm64
          chmod +x dist/test-build-processes_linux_arm64

      - name: Run GoReleaser Pro
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean ${{ steps.version.outputs.is_snapshot == 'true' && '--snapshot' || '' }}
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: steps.version.outputs.is_snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-and-archives
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7


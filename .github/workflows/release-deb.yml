name: Release with Deb Packages

on:
  push:
    tags: ["deb-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Stage 1: Build binaries on AlmaLinux for both architectures
  Build-Binaries:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # x86_64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: almalinux:8
            arch: x86_64

          # aarch64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: almalinux:8
            arch: aarch64

    steps:
      - name: Install dependencies (AlmaLinux)
        if: ${{ contains(matrix.container, 'almalinux') }}
        run: |
          dnf install -y gcc gcc-c++ make git curl tar gzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add Rust target
        run: |
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python (for version check)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          dnf install -y python3

      - name: Check version matches tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          # Strip 'deb-' prefix for version comparison
          TAG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^deb-//')
          python3 .github/scripts/tag_check.py "$TAG_VERSION"

      - name: Cargo build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary for upload
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/test-build-processes artifacts/test-build-processes-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/test-build-processes-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # Stage 2: Use nfpm to create .deb packages from pre-built binaries
  Package-Deb:
    needs: [Build-Binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            nfpm_arch: amd64
            go_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            nfpm_arch: arm64
            go_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip deb- prefix for version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^deb-//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ./binaries

      - name: Install nfpm
        run: |
          # Download nfpm from GitHub releases (use x86_64 or arm64 naming)
          if [ "${{ matrix.go_arch }}" = "amd64" ]; then
            NFPM_ARCH="x86_64"
          else
            NFPM_ARCH="arm64"
          fi
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v2.43.4/nfpm_2.43.4_Linux_${NFPM_ARCH}.tar.gz" -o nfpm.tar.gz
          tar -xzf nfpm.tar.gz nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version

      - name: Create .deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          BINARY_PATH: binaries/test-build-processes-${{ matrix.target }}
        run: |
          mkdir -p dist
          chmod +x "$BINARY_PATH"

          # Substitute environment variables in nfpm.yaml for this run
          envsubst < nfpm.yaml > nfpm-build.yaml

          nfpm package --packager deb --config nfpm-build.yaml --target "dist/test-build-processes_${VERSION}_${{ matrix.nfpm_arch }}.deb"
          ls -lh dist/

      - name: Create tarball archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Create archive with binary and docs
          mkdir -p archive-temp
          cp binaries/test-build-processes-${{ matrix.target }} archive-temp/test-build-processes
          [ -f CLAUDE.md ] && cp CLAUDE.md archive-temp/ || true
          [ -f RELEASE.md ] && cp RELEASE.md archive-temp/ || true
          chmod +x archive-temp/test-build-processes

          cd archive-temp
          tar -czf "../dist/test-build-processes_${VERSION}_linux_${{ matrix.nfpm_arch }}.tar.gz" *
          cd ..
          rm -rf archive-temp

          ls -lh dist/

      - name: Upload deb packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.nfpm_arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.nfpm_arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Stage 3: Create GitHub Release with all artifacts
  Create-Release:
    needs: [Package-Deb]
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Strip deb- prefix for version
        id: version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^deb-//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{deb-*,archive-*}"
          path: ./release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Welcome to release ${{ github.ref_name }} of test-build-processes!

            This release includes **Debian packages (.deb)** for easy installation on Debian-based systems.

            **Available packages:**
            - `test-build-processes_${{ steps.version.outputs.version }}_amd64.deb` - Debian package for x86_64 with post-install hooks
            - `test-build-processes_${{ steps.version.outputs.version }}_arm64.deb` - Debian package for ARM64 with post-install hooks
            - `test-build-processes_${{ steps.version.outputs.version }}_linux_amd64.tar.gz` - Tarball for x86_64
            - `test-build-processes_${{ steps.version.outputs.version }}_linux_arm64.tar.gz` - Tarball for ARM64

            **Installation (Debian/Ubuntu):**
            ```bash
            # For x86_64/amd64:
            sudo dpkg -i test-build-processes_${{ steps.version.outputs.version }}_amd64.deb

            # For ARM64:
            sudo dpkg -i test-build-processes_${{ steps.version.outputs.version }}_arm64.deb
            ```

            **Installation (Generic Linux - tar.gz):**
            ```bash
            tar -xzf test-build-processes_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            sudo mv test-build-processes /usr/local/bin/
            ```

            **Build Information:**
            - Built on AlmaLinux 8 (glibc 2.28) for broad compatibility
            - Packaged with nfpm
            - Binaries are dynamically linked against glibc 2.28+
            - .deb packages install to `/usr/local/bin` with post-installation hooks

            **Checksums:**
            See `checksums.txt` for SHA256 checksums of all artifacts.
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-test') }}
          files: release-assets/*


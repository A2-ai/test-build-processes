name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Release-Build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # x86_64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: almalinux:8
            arch: x86_64

          # aarch64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: almalinux:8
            arch: aarch64

    steps:
      - name: Install dependencies (AlmaLinux)
        if: ${{ contains(matrix.container, 'almalinux') }}
        run: |
          dnf install -y gcc gcc-c++ make git curl tar gzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add Rust target
        run: |
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cargo build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target ${{ matrix.target }}

      - name: Archive
        run: |
          mkdir -p artifacts
          cp -av target/${{ matrix.target }}/release/test-build-processes .
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            ARTIFACT_NAME="test-build-processes-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          else
            ARTIFACT_NAME="test-build-processes-${{ matrix.target }}.tar.gz"
          fi
          tar -czf "$ARTIFACT_NAME" test-build-processes
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: test-build-processes-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 7

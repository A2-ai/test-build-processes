name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Release-Build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # x86_64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: almalinux:8
            arch: x86_64

          # aarch64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: almalinux:8
            arch: aarch64

    steps:
      - name: Install dependencies (AlmaLinux)
        if: ${{ contains(matrix.container, 'almalinux') }}
        run: |
          dnf install -y gcc gcc-c++ make git curl tar gzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add Rust target
        run: |
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python (for version check)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          dnf install -y python3

      - name: Check version matches tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python3 .github/scripts/tag_check.py "${{ github.ref_name }}"

      - name: Cargo build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target ${{ matrix.target }}

      - name: Archive
        run: |
          mkdir -p artifacts
          cp -av target/${{ matrix.target }}/release/test-build-processes .
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            ARTIFACT_NAME="test-build-processes-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          else
            ARTIFACT_NAME="test-build-processes-${{ matrix.target }}.tar.gz"
          fi
          tar -czf "$ARTIFACT_NAME" test-build-processes
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: test-build-processes-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 7

  Release:
    needs: [Release-Build]
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write

    steps:
      - name: Ensure artifacts dir exists
        run: mkdir -p artifacts

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lah artifacts/

      - name: Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Welcome to release ${{ github.ref_name }} of test-build-processes!

            **Build targets:**
            - `x86_64-unknown-linux-gnu`: Built on AlmaLinux 8 (glibc 2.28) for broad compatibility
            - `aarch64-unknown-linux-gnu`: Built on AlmaLinux 8 (glibc 2.28) for ARM64 systems

            All binaries are dynamically linked against glibc 2.28+.
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-test') }}
          files: artifacts/*

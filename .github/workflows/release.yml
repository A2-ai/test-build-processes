name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Release-Build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # x86_64 GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: almalinux:8
            arch: x86_64

    steps:
      - name: Install dependencies (AlmaLinux)
        if: ${{ contains(matrix.container, 'almalinux') }}
        run: |
          dnf install -y gcc gcc-c++ make git curl tar gzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add Rust target
        run: |
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cargo build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target ${{ matrix.target }}

      - name: Archive
        run: |
          mkdir -p artifacts
          cp -av target/${{ matrix.target }}/release/test-build-processes .
          tar -czf test-build-processes-${{ matrix.target }}.tar.gz test-build-processes

      - uses: actions/upload-artifact@v4
        with:
          name: test-build-processes-${{ matrix.target }}
          path: test-build-processes-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

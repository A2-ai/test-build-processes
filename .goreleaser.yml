version: 2

# Use prebuilt binaries feature (GoReleaser Pro)
# Binaries are built in the Build-Binaries stage on AlmaLinux 8 containers
# This avoids cross-compilation issues and ensures glibc 2.28 compatibility
builds:
  - id: test-build-processes
    binary: test-build-processes
    dir: "."
    # Tell GoReleaser to use pre-built binaries instead of building
    # The path should match where we place the binaries in the workflow
    prebuilt:
      path: dist/{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}/{{ .Binary }}{{ .Ext }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

archives:
  - id: test-build-processes-archive
    format_overrides:
      - goos: linux
        format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*
      - CLAUDE.md

nfpms:
  - id: test-build-processes-deb
    package_name: test-build-processes
    vendor: a2-ai
    homepage: https://github.com/a2-ai/test-build-processes
    maintainer: a2-ai Team
    description: |
      test-build-processes - A minimal Rust binary application
      Demonstrates multi-architecture builds and .deb package generation
    license: MIT
    formats:
      - deb

    # Install binary to /usr/local/bin
    bindir: /usr/local/bin

    # Set file permissions
    file_name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Arch }}

    # Scripts for installation lifecycle
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh

    # File metadata - include the scripts in the package
    contents:
      - src: scripts/postinstall.sh
        dst: /usr/share/doc/test-build-processes/postinstall.sh
        type: config
      - src: scripts/preremove.sh
        dst: /usr/share/doc/test-build-processes/preremove.sh
        type: config

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Release configuration
release:
  github:
    owner: a2-ai
    name: test-build-processes
  draft: true
  prerelease: auto
  name_template: "{{ .Tag }}"
  header: |
    Welcome to release {{ .Tag }} of test-build-processes!

    This release includes **Debian packages (.deb)** for easy installation on Debian-based systems.

    **Available packages:**
    - `test-build-processes_*.deb` - Debian packages with post-install hooks
    - `test-build-processes_*.tar.gz` - Tarball archives

    **Installation (Debian/Ubuntu):**
    ```bash
    # Download the appropriate .deb file for your architecture
    # For x86_64/amd64:
    sudo dpkg -i test-build-processes_*_amd64.deb

    # For ARM64:
    sudo dpkg -i test-build-processes_*_arm64.deb
    ```

    **Build Information:**
    - Built on AlmaLinux 8 (glibc 2.28) for broad compatibility
    - Packaged with GoReleaser Pro using prebuilt binaries
    - Binaries are dynamically linked against glibc 2.28+
    - .deb packages install to `/usr/local/bin` with post-installation hooks
